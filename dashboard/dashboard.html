<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>完整报表 · 脑力守护</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="mark">Brain Protector</div>
        <h1>数据报表</h1>
        <div class="sub" id="dateSub">—</div>
      </div>
      <div class="head-actions">
        <button class="btn" id="themeBtn"></button>
        <button class="btn" id="optionsBtn">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</button>
      </div>
    </div>

    <!-- 概览卡片 -->
    <div class="cards" id="summaryCards"></div>

    <!-- 浏览 vs 创作 -->
    <div class="panel glass">
      <h2><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7"/><rect x="12" y="7" width="3" height="11"/><rect x="17" y="13" width="3" height="5"/></svg>今日浏览 vs 创作</h2>
      <div class="split-bar" id="bvcBar"></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--steel)"></i>浏览 <b id="bvcBrowse">—</b></span>
        <span><i class="dot" style="background:var(--teal)"></i>创作 <b id="bvcCreate">—</b></span>
      </div>
    </div>

    <div class="grid2">
      <!-- 网站排行 -->
      <div class="panel glass">
        <h2><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>网站排行 Top 10（今日）</h2>
        <div id="siteRank"></div>
      </div>
      <!-- 分类占比 -->
      <div class="panel glass">
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10h-10z"/><path d="M12 2v10l7 7"/></svg>分类时间占比（今日）</h2>
        <div id="catDist"></div>
      </div>
    </div>

    <div class="grid2">
      <!-- 知乎话题排行 -->
      <div class="panel glass">
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h12v16H4zM16 8h4v10a2 2 0 0 1-4 0zM7 8h6M7 12h6M7 16h4"/></svg>知乎话题排行 Top 15（本周）</h2>
        <div id="zhihuTopics"></div>
      </div>
      <!-- 创作详情 -->
      <div class="panel glass">
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>创作时间详情（今日）</h2>
        <div id="createDetail"></div>
      </div>
    </div>

    <!-- 周趋势 -->
    <div class="panel glass">
      <div class="panel-head">
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>近 7 天趋势</h2>
        <select id="trendMetric" class="trend-select" aria-label="选择趋势指标"></select>
      </div>
      <div class="week" id="weekTrend"></div>
      <div class="legend" id="weekLegend" style="margin-top:8px;justify-content:center;"></div>
    </div>
  </div>

  <script src="../src/db.js"></script>
  <script src="../src/categorize.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
