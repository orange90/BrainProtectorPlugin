<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新标签页 · 脑力守护</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="container">

    <div class="app-header">
      <div class="app-title">
        <span class="logo">🧠</span> 脑力守护
        <span class="greet" id="greet"></span>
      </div>
      <div class="header-actions">
        <a class="link-btn" id="dashboardLink" href="../dashboard/dashboard.html" target="_blank">📊 完整报表</a>
        <a class="link-btn" id="optionsLink" href="../options/options.html" target="_blank">⚙️ 设置</a>
        <button id="themeBtn">
          <span id="themeBtnIcon">🌙</span>
          <span id="themeBtnLabel">暗黑</span>
        </button>
      </div>
    </div>

    <!-- ── 顶部指标条 ── -->
    <div class="metric-strip">
      <div class="metric-card">
        <div class="lbl">浏览总时长</div>
        <div class="val" id="tdTotalBrowse">—</div>
        <div class="sub">今日</div>
      </div>
      <div class="metric-card">
        <div class="lbl">创作总时长</div>
        <div class="val" id="tdTotalCreate" style="color:var(--green)">—</div>
        <div class="sub">键盘输入</div>
      </div>
      <div class="metric-card">
        <div class="lbl">数码娱乐</div>
        <div class="val" id="tdWasteTime">—</div>
        <div class="sub" id="tdWasteSub">知乎话题</div>
      </div>
      <div class="metric-card">
        <div class="lbl">专注分数</div>
        <div class="val" id="focusScore">—</div>
        <div class="sub">会话中</div>
      </div>
      <div class="metric-card">
        <div class="lbl">专注时长</div>
        <div class="val" id="focusTime">00:00</div>
        <div class="sub" id="focusTimeSub">未开始</div>
      </div>
      <div class="metric-card">
        <div class="lbl">切换 / 有害</div>
        <div class="val"><span id="switchCount">0</span> <span style="font-size:14px;color:var(--tx-muted)">/</span> <span id="harmCountInline" style="color:var(--red)">0</span></div>
        <div class="sub">次数</div>
      </div>
    </div>

    <!-- ── Tab 导航 ── -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="time"><span class="ic">⏱️</span>时间管理</button>
      <button class="tab-btn" data-tab="task"><span class="ic">🗂️</span>任务管理</button>
      <button class="tab-btn" data-tab="state"><span class="ic">🧠</span>状态管理</button>
    </div>

    <!-- ════════ Tab：时间管理 ════════ -->
    <div class="tab-pane active" id="pane-time">

      <!-- 计时器 -->
      <div class="panel timer-panel">
        <div class="panel-title"><span class="ic">⏱️</span>专注计时器</div>
        <div class="timer-card">
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div class="timer-label" id="timerLabel">番茄时钟 · 待开始</div>

          <div class="timer-modes">
            <button class="timer-mode active" id="modePomodoro">🍅 番茄 25m</button>
            <button class="timer-mode" id="modeDeep">🧠 深度 90m</button>
            <button class="timer-mode" id="modeCustom">⚙️ 自定义</button>
          </div>

          <div class="timer-progress-wrap">
            <div class="timer-progress-fill" id="timerProgress" style="width:0%"></div>
          </div>

          <div class="timer-actions">
            <button class="timer-start" id="startBtn"><span class="play-ic">▶</span><span id="startLabel">开始</span></button>
            <button class="timer-reset" id="resetBtn" title="重置">↻</button>
          </div>
        </div>
      </div>

      <!-- 浏览 & 创作时间 -->
      <div class="panel">
        <div class="panel-title"><span class="ic">📊</span>浏览 &amp; 创作时间</div>

        <div class="section-block">
          <div class="section-lbl">各网站浏览</div>
          <div id="siteRows"></div>
        </div>

        <div class="section-block">
          <div class="section-lbl">知乎话题分析</div>
          <div id="zhihuRows"></div>
        </div>

        <div class="section-block" style="background:var(--green-bg);border-color:var(--green);">
          <div class="section-lbl" style="color:var(--green);">创作时间明细</div>
          <div class="create-badges" id="createRows"></div>
        </div>
      </div>
    </div>

    <!-- ════════ Tab：任务管理 ════════ -->
    <div class="tab-pane" id="pane-task">
      <div class="panel">
        <div class="panel-title"><span class="ic">🗂️</span>标签页整理</div>

        <div class="task-toolbar">
          <div class="task-stats" id="taskStats">—</div>
          <input type="search" id="tabSearch" class="task-search" placeholder="🔍 搜索标题或域名…" />
          <div class="task-seg">
            <button class="seg-btn active" id="groupByDomain" data-group="domain">按域名</button>
            <button class="seg-btn" id="groupByCategory" data-group="category">按类别</button>
          </div>
          <div class="task-seg" id="taskFilterSeg">
            <button class="seg-btn active" data-filter="all">全部</button>
            <button class="seg-btn" data-filter="stale">⏰ 陈旧</button>
            <button class="seg-btn" data-filter="dup">🔁 重复</button>
          </div>
          <button class="ctrl-btn" id="refreshTabsBtn">🔄 刷新</button>
          <button class="ctrl-btn" id="applyGroupsBtn">✨ 一键应用为 Chrome 标签组</button>
        </div>

        <div id="taskGroups" class="task-groups"></div>
      </div>
    </div>

    <!-- ════════ Tab：状态管理 ════════ -->
    <div class="tab-pane" id="pane-state">
      <div class="main-layout">
        <div>
          <!-- 切换记录 -->
          <div class="panel">
            <div class="panel-title"><span class="ic">🔀</span>切换记录</div>
            <button class="ctrl-btn" id="logSwitchBtn" style="width:100%;justify-content:center;margin-bottom:9px;">➕ 记录切换 ↗</button>
            <ul class="log-list" id="switchLog">
              <li style="font-size:11px;color:var(--tx-muted);padding:6px 0;">暂无记录</li>
            </ul>
          </div>

          <!-- 有害行为 -->
          <div class="panel">
            <div class="panel-title"><span class="ic">⚠️</span>有害行为</div>
            <div id="harmChecklist"></div>
          </div>
        </div>

        <div>
          <!-- 认知负荷 -->
          <div class="panel">
            <div class="panel-title"><span class="ic">📈</span>认知负荷</div>
            <div id="cogBars"></div>
          </div>

          <!-- 实时建议 -->
          <div class="panel">
            <div class="panel-title"><span class="ic">💡</span>实时建议</div>
            <div id="insights"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script src="../src/db.js"></script>
  <script src="../src/categorize.js"></script>
  <script src="newtab.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
