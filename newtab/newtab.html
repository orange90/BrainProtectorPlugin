<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新标签页 · 脑力守护</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="container">

    <div class="app-header">
      <div class="app-title">
        <span class="logo">🧠</span> 脑力守护
        <span class="greet" id="greet"></span>
      </div>
      <div class="header-actions">
        <a class="link-btn" id="dashboardLink" href="../dashboard/dashboard.html" target="_blank">📊 完整报表</a>
        <a class="link-btn" id="optionsLink" href="../options/options.html" target="_blank">⚙️ 设置</a>
        <button id="themeBtn">
          <span id="themeBtnIcon">🌙</span>
          <span id="themeBtnLabel">暗黑</span>
        </button>
      </div>
    </div>

    <!-- ── 顶部指标条 ── -->
    <div class="metric-strip">
      <div class="metric-card">
        <div class="lbl">浏览总时长</div>
        <div class="val" id="tdTotalBrowse">—</div>
        <div class="sub">今日</div>
      </div>
      <div class="metric-card">
        <div class="lbl">创作总时长</div>
        <div class="val" id="tdTotalCreate" style="color:var(--green)">—</div>
        <div class="sub">键盘输入</div>
      </div>
      <div class="metric-card">
        <div class="lbl">数码娱乐</div>
        <div class="val" id="tdWasteTime">—</div>
        <div class="sub" id="tdWasteSub">知乎话题</div>
      </div>
      <div class="metric-card">
        <div class="lbl">专注分数</div>
        <div class="val" id="focusScore">—</div>
        <div class="sub">会话中</div>
      </div>
      <div class="metric-card">
        <div class="lbl">专注时长</div>
        <div class="val" id="focusTime">00:00</div>
        <div class="sub" id="focusTimeSub">未开始</div>
      </div>
      <div class="metric-card">
        <div class="lbl">切换 / 有害</div>
        <div class="val"><span id="switchCount">0</span> <span style="font-size:14px;color:var(--tx-muted)">/</span> <span id="harmCountInline" style="color:var(--red)">0</span></div>
        <div class="sub">次数</div>
      </div>
    </div>

    <!-- ── 左右主布局 ── -->
    <div class="main-layout">

      <!-- ════ 左列：浏览时间 ════ -->
      <div>
        <div class="panel">
          <div class="panel-title"><span class="ic">📊</span>浏览 &amp; 创作时间</div>

          <div class="section-block">
            <div class="section-lbl">各网站浏览</div>
            <div id="siteRows"></div>
          </div>

          <div class="section-block">
            <div class="section-lbl">知乎话题分析</div>
            <div id="zhihuRows"></div>
          </div>

          <div class="section-block" style="background:var(--green-bg);border-color:var(--green);">
            <div class="section-lbl" style="color:var(--green);">创作时间明细</div>
            <div class="create-badges" id="createRows"></div>
          </div>
        </div>
      </div>

      <!-- ════ 右列：专注工具 ════ -->
      <div>

        <!-- 计时器 -->
        <div class="panel">
          <div class="panel-title"><span class="ic">⏱️</span>专注计时器</div>
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <div>
              <div class="timer-display" id="timerDisplay">25:00</div>
              <div class="timer-label" id="timerLabel">番茄时钟 · 待开始</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="ctrl-btn active" id="modePomodoro">🍅 番茄 25m</button>
                <button class="ctrl-btn" id="modeDeep">🧠 深度 90m</button>
                <button class="ctrl-btn" id="modeCustom">⚙️ 自定义</button>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="ctrl-btn" id="startBtn">▶️ <span id="startLabel">开始</span></button>
                <button class="ctrl-btn" id="resetBtn">🔄 重置</button>
              </div>
            </div>
          </div>
          <div class="timer-progress-wrap">
            <div class="timer-progress-fill" id="timerProgress" style="width:0%"></div>
          </div>
        </div>

        <!-- 切换记录 + 有害行为 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
          <div class="panel" style="margin-bottom:0;">
            <div class="panel-title"><span class="ic">🔀</span>切换记录</div>
            <button class="ctrl-btn" id="logSwitchBtn" style="width:100%;justify-content:center;margin-bottom:9px;">➕ 记录切换 ↗</button>
            <ul class="log-list" id="switchLog">
              <li style="font-size:11px;color:var(--tx-muted);padding:6px 0;">暂无记录</li>
            </ul>
          </div>
          <div class="panel" style="margin-bottom:0;">
            <div class="panel-title"><span class="ic">⚠️</span>有害行为</div>
            <div id="harmChecklist"></div>
          </div>
        </div>

        <!-- 认知负荷 -->
        <div class="panel">
          <div class="panel-title"><span class="ic">📈</span>认知负荷</div>
          <div id="cogBars"></div>
        </div>

        <!-- 实时建议 -->
        <div class="panel">
          <div class="panel-title"><span class="ic">💡</span>实时建议</div>
          <div id="insights"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="../src/db.js"></script>
  <script src="../src/categorize.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
