<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新标签页 · 脑力守护</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="container">

    <div class="app-header">
      <div class="brand">
        <div class="mark">Brain Protector</div>
        <div class="name">脑力守护 <span class="greet" id="greet"></span></div>
      </div>
      <div class="header-actions">
        <a class="link-btn" id="optionsLink" href="../options/options.html">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</a>
        <button id="themeBtn">
          <span id="themeBtnIcon" style="display:inline-flex"></span>
          <span id="themeBtnLabel">暗黑</span>
        </button>
      </div>
    </div>

    <!-- ── Tab 导航 ── -->
    <div class="tab-nav" id="tabNav">
      <span class="tab-indicator" id="tabIndicator"></span>
      <button class="tab-btn active" data-tab="time">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>时间管理</button>
      <button class="tab-btn" data-tab="task">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>任务管理</button>
      <button class="tab-btn" data-tab="state">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>状态管理</button>
    </div>

    <!-- ════════ Tab：时间管理 ════════ -->
    <div class="tab-pane active" id="pane-time">
      <div class="pane-toolbar">
        <a class="link-btn" id="dashboardLink" href="../dashboard/dashboard.html">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>完整报表</a>
      </div>
      <div class="metric-strip metric-strip-time">
        <div class="metric-card glass">
          <div class="lbl">浏览总时长</div>
          <div class="val" id="tdTotalBrowse">—</div>
          <div class="sub">今日</div>
        </div>
        <div class="metric-card glass">
          <div class="lbl">创作总时长</div>
          <div class="val" id="tdTotalCreate" style="color:var(--teal)">—</div>
          <div class="sub">键盘输入</div>
        </div>
        <div class="metric-card glass">
          <div class="lbl">数码娱乐</div>
          <div class="val" id="tdWasteTime">—</div>
          <div class="sub" id="tdWasteSub">知乎话题</div>
        </div>
        <div class="metric-card glass">
          <div class="lbl">专注分数</div>
          <div class="val" id="focusScore">—</div>
          <div class="sub">会话中</div>
        </div>
        <div class="metric-card glass">
          <div class="lbl">专注时长</div>
          <div class="val" id="focusTime">00:00</div>
          <div class="sub" id="focusTimeSub">未开始</div>
        </div>
      </div>
      <div class="time-layout">
        <!-- 计时器 -->
        <div class="panel glass timer-panel">
          <div class="panel-title">
            <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>专注计时器</div>
          <div class="timer-card">
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-label" id="timerLabel">番茄时钟 · 待开始</div>

            <div class="timer-modes">
              <button class="timer-mode active" id="modePomodoro">番茄 · 25</button>
              <button class="timer-mode" id="modeDeep">深度 · 90</button>
              <button class="timer-mode" id="modeCustom">自定义</button>
            </div>

            <div class="timer-progress-wrap">
              <div class="timer-progress-fill" id="timerProgress" style="width:0%"></div>
            </div>

            <div class="timer-actions">
              <button class="timer-start" id="startBtn">
                <span class="play-ic"><svg class="ic ic-fill" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg></span>
                <span id="startLabel">开始</span></button>
              <button class="timer-reset" id="resetBtn" title="重置">
                <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg></button>
            </div>

            <label class="timer-notify" for="notifyToggle">
              <input type="checkbox" id="notifyToggle">
              <span>完成后弹窗提醒（含提示音）</span>
            </label>
          </div>
        </div>

        <!-- 浏览 & 创作时间 -->
        <div class="panel glass">
          <div class="panel-title">
            <svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="7"/><rect x="12" y="7" width="3" height="11"/><rect x="17" y="13" width="3" height="5"/></svg>浏览 &amp; 创作时间</div>

          <div class="section-block">
            <div class="section-lbl">各网站浏览</div>
            <div id="siteRows"></div>
          </div>

          <div class="section-block">
            <div class="section-lbl">知乎话题分析</div>
            <div id="zhihuRows"></div>
          </div>

          <div class="section-block">
            <div class="section-lbl" style="color:var(--teal)">创作时间明细</div>
            <div class="create-badges" id="createRows"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ════════ Tab：任务管理 ════════ -->
    <div class="tab-pane" id="pane-task">
      <div class="panel glass">
        <div class="panel-title">
          <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>标签页整理</div>

        <div class="task-toolbar">
          <div class="task-stats" id="taskStats">—</div>
          <input type="search" id="tabSearch" class="task-search" placeholder="搜索标题或域名…" />
          <div class="task-seg">
            <button class="seg-btn active" id="groupByDomain" data-group="domain">按域名</button>
            <button class="seg-btn" id="groupByCategory" data-group="category">按类别</button>
          </div>
          <div class="task-seg" id="taskFilterSeg">
            <button class="seg-btn active" data-filter="all">全部</button>
            <button class="seg-btn" data-filter="stale">陈旧</button>
            <button class="seg-btn" data-filter="dup">重复</button>
          </div>
          <button class="ctrl-btn" id="refreshTabsBtn">
            <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>刷新</button>
          <button class="ctrl-btn" id="applyGroupsBtn">
            <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M12 3l2 5 5 .5-3.8 3.3 1.2 5L12 19l-4.6 2.8 1.2-5L4.8 8.5 9.8 8z"/></svg>一键应用为 Chrome 标签组</button>
        </div>

        <div id="taskGroups" class="task-groups"></div>
      </div>
    </div>

    <!-- ════════ Tab：状态管理 ════════ -->
    <div class="tab-pane" id="pane-state">
      <div class="metric-strip metric-strip-state">
        <div class="metric-card glass">
          <div class="lbl">切换 / 有害</div>
          <div class="val"><span id="switchCount">0</span> <span style="font-size:16px;color:var(--ink-3)">/</span> <span id="harmCountInline" style="color:var(--crim)">0</span></div>
          <div class="sub">次数</div>
        </div>
      </div>
      <div class="main-layout">
        <div>
          <!-- 切换记录 -->
          <div class="panel glass">
            <div class="panel-title">
              <svg class="ic" viewBox="0 0 24 24"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/></svg>切换记录</div>
            <button class="ctrl-btn" id="logSwitchBtn" style="width:100%;margin-bottom:12px;">
              <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>记录一次切换</button>
            <ul class="log-list" id="switchLog">
              <li class="log-empty">暂无记录</li>
            </ul>
          </div>

          <!-- 有害行为 -->
          <div class="panel glass">
            <div class="panel-title">
              <svg class="ic" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>有害行为</div>
            <div id="harmChecklist"></div>
          </div>
        </div>

        <div>
          <!-- 认知负荷 -->
          <div class="panel glass">
            <div class="panel-title">
              <svg class="ic" viewBox="0 0 24 24"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>认知负荷</div>
            <div id="cogBars"></div>
          </div>

          <!-- 实时建议 -->
          <div class="panel glass">
            <div class="panel-title">
              <svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>实时建议</div>
            <div id="insights"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- 专注完成弹窗 -->
  <div id="timerDoneModal" class="tdm-overlay" hidden>
    <div class="tdm-card glass">
      <div class="tdm-ring">
        <svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div class="tdm-title">专注完成</div>
      <div class="tdm-sub" id="tdmSub">这一轮专注结束了，休息一下吧。</div>
      <div class="tdm-actions">
        <button class="tdm-btn tdm-rest" id="tdmRestBtn">好的，休息一下</button>
        <button class="tdm-btn tdm-again" id="tdmAgainBtn">再来一轮</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../src/db.js"></script>
  <script src="../src/categorize.js"></script>
  <script src="newtab.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
