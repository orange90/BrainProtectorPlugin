<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置 · 脑力守护</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --card:rgba(255,255,255,0.66); --card-solid:#fff; --sunk:#e6eaef;
      --ink:#16181d; --ink-2:#4e545e; --ink-3:#8a909b;
      --line:rgba(20,30,50,0.10); --line-2:rgba(20,30,50,0.16);
      --steel:#2f6fb0; --steel-2:#3b82c9; --teal:#2c7a6b; --crim:#a33a3a;
      --glass-hi:rgba(255,255,255,0.85); --hi-line:rgba(255,255,255,0.7);
      --r-s:6px; --r-m:10px; --r-l:14px;
      --shadow-sm:0 1px 2px rgba(20,30,50,0.06);
      --shadow:0 4px 18px rgba(20,30,50,0.08),0 1px 3px rgba(20,30,50,0.05);
      --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
      --page-grad:radial-gradient(900px 520px at 12% -8%, rgba(59,130,201,0.14), transparent 60%),radial-gradient(760px 480px at 105% 4%, rgba(44,122,107,0.10), transparent 55%),linear-gradient(180deg,#f2f5f8 0%,#e9edf2 100%);
    }
    [data-theme="dark"]{
      --card:rgba(38,44,54,0.55); --card-solid:#20242c; --sunk:#181c22;
      --ink:#e7eaef; --ink-2:#a2a9b4; --ink-3:#6b7280;
      --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.14);
      --steel:#5aa0dd; --steel-2:#6fb2ec; --teal:#5bb39e; --crim:#e07a6e;
      --glass-hi:rgba(255,255,255,0.10); --hi-line:rgba(255,255,255,0.12);
      --shadow-sm:0 1px 2px rgba(0,0,0,0.30); --shadow:0 6px 22px rgba(0,0,0,0.40),0 1px 3px rgba(0,0,0,0.30);
      --page-grad:radial-gradient(900px 520px at 12% -8%, rgba(58,110,170,0.20), transparent 60%),radial-gradient(760px 480px at 105% 4%, rgba(40,110,96,0.16), transparent 55%),linear-gradient(180deg,#15181d 0%,#0f1216 100%);
    }
    html,body { min-height:100%; }
    body { font-family:var(--font); background:var(--page-grad); background-attachment:fixed; color:var(--ink);
      padding:30px 22px 50px; -webkit-font-smoothing:antialiased; letter-spacing:-0.005em; }
    .wrap { max-width:820px; margin:0 auto; }
    .ic { width:16px; height:16px; display:inline-block; flex:none; stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
    .ic-sm { width:14px; height:14px; }
    .topbar { margin-bottom:18px; }
    .mark { font-size:10.5px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--steel); margin-bottom:4px; }
    h1 { font-size:22px; font-weight:650; letter-spacing:0.02em; margin-bottom:6px; }
    .lead { font-size:12.5px; color:var(--ink-3); margin-bottom:22px; }
    .panel { background:var(--card); -webkit-backdrop-filter:blur(16px) saturate(1.4); backdrop-filter:blur(16px) saturate(1.4);
      border:1px solid var(--line); border-radius:var(--r-l); padding:20px 22px; margin-bottom:16px;
      box-shadow:var(--shadow), inset 0 1px 0 var(--hi-line); }
    .panel h2 { font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-2); margin-bottom:6px; }
    .panel .hint { font-size:11.5px; color:var(--ink-3); margin-bottom:16px; line-height:1.6; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; font-size:12.5px; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--ink-3); font-weight:600; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; }
    input[type=text], input[type=number], textarea { width:100%; background:rgba(255,255,255,0.5); border:1px solid var(--line-2);
      border-radius:var(--r-s); padding:8px 10px; font-size:12.5px; color:var(--ink); font-family:inherit; }
    [data-theme="dark"] input[type=text], [data-theme="dark"] input[type=number], [data-theme="dark"] textarea { background:rgba(255,255,255,0.05); }
    input:focus, textarea:focus { outline:none; border-color:var(--steel); }
    input[type=color] { width:38px; height:30px; border:1px solid var(--line-2); border-radius:var(--r-s); background:transparent; cursor:pointer; padding:2px; }
    textarea { min-height:140px; resize:vertical; font-family:ui-monospace,"SF Mono",Menlo,monospace; line-height:1.6; }
    .cat-name { font-weight:600; min-width:90px; }
    .num { width:64px; }
    .btn { border:1px solid var(--line-2); border-radius:var(--r-m); padding:9px 15px; font-size:12.5px; cursor:pointer; font-family:inherit;
      background:linear-gradient(180deg,var(--glass-hi),rgba(255,255,255,0.45)); color:var(--ink);
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:var(--shadow-sm), inset 0 1px 0 var(--hi-line);
      display:inline-flex; align-items:center; gap:7px; transition:border-color .18s, transform .12s, filter .18s; }
    [data-theme="dark"] .btn { background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02)); }
    .btn:hover { border-color:var(--ink-3); }
    .btn:active { transform:scale(.98); }
    .btn.primary { background:linear-gradient(180deg,var(--steel-2),var(--steel)); color:#fff; border-color:rgba(47,111,176,0.6);
      box-shadow:0 6px 16px rgba(47,111,176,0.3), inset 0 1px 0 rgba(255,255,255,0.4); }
    .btn.primary:hover { filter:brightness(1.05); }
    .btn.danger { color:var(--crim); border-color:rgba(163,58,58,0.45); }
    .btn-x { background:transparent; border:none; color:var(--ink-3); cursor:pointer; padding:3px; border-radius:var(--r-s); display:inline-flex; }
    .btn-x:hover { color:var(--crim); }
    .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; }
    .status { font-size:12.5px; color:var(--teal); margin-left:auto; font-weight:500; }
    .addcat { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    .addcat input { max-width:200px; }
  </style>
  <script>
    /* 跟随全局主题偏好（system|light|dark），尽早执行以减少闪烁 */
    (function () {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      function apply(pref) {
        var dark = pref === 'dark' || (pref === 'system' && mq.matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      }
      apply(mq.matches ? 'system' : 'system');
      try {
        chrome.storage.local.get(['theme'], function (res) {
          apply(['system', 'light', 'dark'].includes(res.theme) ? res.theme : 'system');
        });
      } catch (e) { /* ignore */ }
      mq.addEventListener('change', function () {
        try {
          chrome.storage.local.get(['theme'], function (res) {
            var pref = res.theme || 'system';
            if (pref === 'system') apply('system');
          });
        } catch (e) { /* ignore */ }
      });
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <button class="btn back-btn" id="backBtn">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>返回</button>
    </div>
    <div class="mark">Brain Protector</div>
    <h1>设置</h1>
    <div class="lead">所有规则与数据都保存在本地浏览器，绝不上传任何服务器。</div>

    <div class="panel">
      <h2>分类规则</h2>
      <div class="hint">命中任一关键词即归入该分类（优先匹配深度感知层标签，再匹配标题）。阈值大于 0 时，超出会在仪表盘标记提醒。</div>
      <table>
        <thead>
          <tr><th class="cat-name">分类</th><th>关键词（逗号分隔）</th><th>颜色</th><th>阈值(分)</th><th></th></tr>
        </thead>
        <tbody id="catBody"></tbody>
      </table>
      <div class="addcat">
        <input type="text" id="newCatName" placeholder="新分类名称" />
        <button class="btn" id="addCatBtn">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加分类</button>
      </div>
    </div>

    <div class="panel">
      <h2>域名分组</h2>
      <div class="hint">JSON 格式：分组名 → 域名数组。用于报表里的网站归类。</div>
      <textarea id="siteGroupsArea" spellcheck="false"></textarea>
    </div>

    <div class="panel">
      <h2>数据管理</h2>
      <div class="hint">导出可做备份；清空将永久删除全部时间记录与专注会话。</div>
      <div class="actions">
        <button class="btn" id="exportBtn">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>导出数据 (JSON)</button>
        <button class="btn danger" id="clearBtn">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>清空全部数据</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="saveBtn">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存设置</button>
      <button class="btn" id="resetBtn">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>恢复默认规则</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <script src="../src/db.js"></script>
  <script src="../src/categorize.js"></script>
  <script src="options.js"></script>
</body>
</html>
